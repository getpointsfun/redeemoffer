<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雲林好食宴｜優惠兌換</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --ink: #1B2140;
    --cream: #FBF6ED;
    --marigold: #E8A33D;
    --coral: #D8586B;
    --teal: #3F7D58;
    --charcoal: #2B2A28;
    --muted: #8A8577;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(216,88,105,0.10), transparent 40%);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--charcoal);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }

  .stage{ width:100%; max-width: 400px; }

  .event-banner{
    width: 100%;
    display: block;
    border-radius: 6px;
    margin-bottom: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  }

  .brand{
    text-align:left;
    color: rgba(251,246,237,0.65);
    font-size: 13px;
    margin-bottom: 14px;
    padding-left: 6px;
  }

  .ticket{
    position: relative;
    background: var(--cream);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }

  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    background: var(--ink);
    border-radius:50%;
    left: -13px;
  }
  .ticket::before{ top: 190px; }
  .ticket::after{ top: 190px; left: auto; right: -13px; }

  .store-photo{
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
    background: rgba(0,0,0,0.15);
  }

  .ticket-head{
    background: var(--ink);
    color: var(--cream);
    padding: 22px 26px 34px;
  }
  .ticket-head.with-photo{ padding-top: 18px; }

  .event-tag{ font-size: 12px; color: var(--marigold); font-weight:500; margin-bottom: 8px; }

  .store-name{
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 6px;
  }

  .sub-line{ font-size: 13px; color: rgba(251,246,237,0.7); }

  .perforation{
    height: 0;
    border-top: 2px dashed rgba(43,42,40,0.18);
    margin: 0 26px;
    position: relative;
    top: -1px;
  }

  .ticket-body{ padding: 26px 26px 26px; }

  .offer-label{ font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  .offer-title{
    font-family: 'Noto Serif TC', serif;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.5;
    margin: 0 0 10px;
    color: var(--ink);
  }

  .offer-desc{
    font-size: 14px;
    line-height: 1.7;
    color: var(--charcoal);
    margin: 0 0 18px;
    white-space: pre-line;
  }

  .website-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid rgba(27,33,64,0.3);
    padding-bottom: 2px;
    margin-bottom: 24px;
  }
  .website-link:hover{ border-bottom-color: var(--ink); }

  button.primary{
    width:100%;
    padding: 16px;
    border: none;
    border-radius: 4px;
    background: var(--coral);
    color: var(--cream);
    font-size: 16px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor:pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button.primary:active{ transform: scale(0.98); background:#c14a5c; }

  .link-btn{
    display:block;
    text-align:center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .verify-instruction{ font-size: 14px; line-height:1.8; color: var(--charcoal); margin-bottom: 24px; }
  .verify-instruction strong{ color: var(--ink); }

  .code-inputs{ display:flex; gap: 12px; justify-content:center; margin-bottom: 28px; }
  .code-inputs input{
    width: 54px; height: 64px; text-align:center;
    font-size: 28px; font-weight:700; font-family: 'Noto Sans TC', sans-serif;
    border: 2px solid rgba(43,42,40,0.2); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .code-inputs input:focus{ outline:none; border-color: var(--coral); }

  .error-msg{ font-size: 13px; color: var(--coral); text-align:center; margin: -14px 0 18px; min-height: 16px; }

  .success-wrap{ text-align:center; padding: 20px 0 6px; }
  .check-circle{
    width: 84px; height: 84px; border-radius: 50%; background: var(--teal);
    margin: 0 auto 22px; display:flex; align-items:center; justify-content:center;
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ 0%{ transform: scale(0); opacity:0; } 100%{ transform: scale(1); opacity:1; } }
  .check-circle svg{ width: 42px; height:42px; }

  .success-title{ font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight:700; color: var(--ink); margin: 0 0 6px; }
  .success-sub{ font-size: 13px; color: var(--muted); margin-bottom: 26px; }

  .receipt{ text-align:left; background: rgba(43,42,40,0.04); border-radius: 4px; padding: 16px 18px; }
  .receipt-row{ display:flex; justify-content:space-between; font-size: 13px; padding: 6px 0; color: var(--charcoal); gap: 12px; }
  .receipt-row + .receipt-row{ border-top: 1px solid rgba(43,42,40,0.08); }
  .receipt-row span:first-child{ color: var(--muted); flex-shrink:0; }
  .receipt-row span:last-child{ font-weight:500; text-align:right; }

  .timestamp{ text-align:center; font-size: 11px; color: rgba(43,42,40,0.4); margin-top: 18px; font-variant-numeric: tabular-nums; }

  .staff-field{ margin-bottom: 20px; }
  .staff-field label{ display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .staff-field input{
    width: 100%; padding: 10px 12px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
    border: 1px solid rgba(43,42,40,0.2); border-radius: 6px; background: #fff; color: var(--ink);
    box-sizing: border-box;
  }
  .staff-field input:focus{ outline:none; border-color: var(--coral); }

  .not-found{ text-align:center; padding: 50px 26px; }
  .not-found .icon{ font-size: 40px; margin-bottom: 16px; }
  .not-found h2{ font-family:'Noto Serif TC', serif; font-size:19px; color:var(--ink); margin: 0 0 10px; }
  .not-found p{ font-size: 13px; color: var(--muted); line-height:1.7; }

  .hidden{ display:none; }
</style>
</head>

/* ============================================================
   以下為頁面邏輯，一般不需要修改
   ============================================================ */
  const root = document.getElementById('ticket-root');

  function getQueryPlan(){
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('plan');
    return raw ? decodeURIComponent(raw).trim() : null;
  }

  function getQueryParam(name){
    const params = new URLSearchParams(window.location.search);
    const raw = params.get(name);
    if(!raw) return '';
    const val = decodeURIComponent(raw).trim();
    // 若集點樂的標籤沒有被成功代換，網址會留下字面上的 [#...#]，視同沒有這個值
    if(val.startsWith('[#') || val.endsWith('#]')) return '';
    return val;
  }

  function findMerchant(planName){
    if(!planName) return null;
    return MERCHANTS.find(m => m.planName.trim() === planName) || null;
  }

  function renderNotFound(){
    root.innerHTML = `
      <div class="not-found">
        <div class="icon">🔍</div>
        <h2>找不到對應的優惠方案</h2>
        <p>若您兌換的是<strong>實體商品</strong>，此頁面對您不適用，請忽略，我們將盡速為您安排出貨。<br><br>若您兌換的是店家優惠方案卻看到此畫面，連結可能已失效或方案資料尚未建置完成，請聯繫活動小組協助確認：king323277@gmail.com</p>
      </div>
    `;
  }

  function renderAlreadyUsed(m, info){
    const msg = info.reason === 'same_member'
      ? '系統顯示您已經兌換過這個優惠方案，每位會員限兌換一次。'
      : '此連結對應的優惠已經核銷過了。';
    root.innerHTML = `
      <div class="not-found">
        <div class="icon">✅</div>
        <h2>此優惠已被核銷過</h2>
        <p>${msg}<br>核銷時間：${info.redeemedAt || '－'}<br>若您認為這是誤判，請聯繫活動小組協助確認：king323277@gmail.com</p>
      </div>
    `;
  }

  function renderOffer(m){
    const hasImage = !!m.image;
    const hasWebsite = !!m.website;
    const memberLine = m.memberName ? `<div class="sub-line">會員：${m.memberName}</div>` : `<div class="sub-line">出示本頁面給店員即可開始兌換</div>`;
    root.innerHTML = `
      <div id="screen-offer">
        ${hasImage ? `<img class="store-photo" src="${m.image}" alt="${m.storeName}" onerror="this.style.display='none'">` : ''}
        <div class="ticket-head ${hasImage ? 'with-photo' : ''}">
          <div class="event-tag">雲林好食宴・特約商家</div>
          <div class="store-name">${m.storeName}</div>
          ${memberLine}
        </div>
        <div class="perforation"></div>
        <div class="ticket-body">
          <div class="offer-label">優惠方案</div>
          <div class="offer-title">${m.offerTitle}</div>
          <p class="offer-desc">${m.offerDesc}</p>
          ${hasWebsite ? `<a class="website-link" href="${m.website}" target="_blank" rel="noopener">查看商家更多資訊 →</a>` : ''}
          <button class="primary" id="btn-redeem">兌換優惠</button>
        </div>
      </div>
    `;
    document.getElementById('btn-redeem').addEventListener('click', () => renderVerify(m));
  }

  function renderVerify(m){
    root.innerHTML = `
      <div id="screen-verify">
        <div class="ticket-head">
          <div class="event-tag">雲林好食宴・特約商家</div>
          <div class="store-name">${m.storeName}</div>
          <div class="sub-line">${m.offerTitle}</div>
        </div>
        <div class="perforation"></div>
        <div class="ticket-body">
          <p class="verify-instruction">請將手機交給店員，由<strong>店員輸入驗證碼</strong>完成兌換。</p>
          <div class="code-inputs">
            <input type="tel" maxlength="1" inputmode="numeric">
            <input type="tel" maxlength="1" inputmode="numeric">
            <input type="tel" maxlength="1" inputmode="numeric">
            <input type="tel" maxlength="1" inputmode="numeric">
          </div>
          <div class="error-msg" id="error-msg"></div>
          <div class="staff-field">
            <label>核銷人員（選填）</label>
            <input type="text" id="staff-name" placeholder="店員姓名或代號">
          </div>
          <button class="primary" id="btn-confirm">確認兌換</button>
          <button class="link-btn" id="btn-back">返回上一步</button>
        </div>
      </div>
    `;

    const inputs = document.querySelectorAll('.code-inputs input');
    inputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g,'');
        if(input.value && idx < inputs.length-1) inputs[idx+1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Backspace' && !input.value && idx > 0) inputs[idx-1].focus();
      });
    });
    setTimeout(() => inputs[0].focus(), 100);

    document.getElementById('btn-back').addEventListener('click', () => renderOffer(m));
    document.getElementById('btn-confirm').addEventListener('click', () => {
      const entered = Array.from(inputs).map(i => i.value).join('');
      const errEl = document.getElementById('error-msg');
      if(entered.length < 4){
        errEl.textContent = '請完整輸入4位數驗證碼';
        return;
      }
      if(entered === STORE_VERIFY_CODE){
        const staffName = document.getElementById('staff-name').value.trim();
        renderSuccess(m, staffName);
      } else {
        errEl.textContent = '驗證碼錯誤，請再試一次';
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
      }
    });
  }

  function logRedemption(orderNumber, memberName, storeName, offerTitle, staffName){
    try{
      fetch(LOG_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ orderNumber, memberName, storeName, offerTitle, staffName })
      }).catch(()=>{ /* 記錄失敗不影響會員兌換體驗，靜默忽略 */ });
    }catch(err){ /* 同上 */ }
  }

  function checkAlreadyUsed(orderNumber, memberName, offerTitle){
    if(!orderNumber && !memberName) return Promise.resolve({ used: false });
    const params = new URLSearchParams();
    if(orderNumber) params.set('order', orderNumber);
    if(memberName) params.set('member', memberName);
    if(offerTitle) params.set('offerTitle', offerTitle);
    return fetch(`${LOG_ENDPOINT}?${params.toString()}`)
      .then(res => res.json())
      .catch(() => ({ used: false })); // 查詢失敗時，不擋會員兌換，退回原本流程
  }

  function renderSuccess(m, staffName){
    const now = new Date();
    const ts = now.toLocaleString('zh-TW', { hour12:false });
    logRedemption(m.orderNumber, m.memberName, m.storeName, m.offerTitle, staffName || '');
    root.innerHTML = `
      <div id="screen-success">
        <div class="ticket-body" style="padding-top:34px;">
          <div class="success-wrap">
            <div class="check-circle">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 12.5L9.5 18L20 6" stroke="#FBF6ED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="success-title">兌換成功</div>
            <div class="success-sub">請店員協助提供優惠商品</div>
          </div>
          <div class="receipt">
            <div class="receipt-row"><span>訂單編號</span><span>${m.orderNumber || '－'}</span></div>
            <div class="receipt-row"><span>商家</span><span>${m.storeName}</span></div>
            <div class="receipt-row"><span>方案</span><span>${m.offerTitle}</span></div>
          </div>
          <div class="timestamp">兌換時間　${ts}</div>
        </div>
      </div>
    `;
  }

  (function init(){
    const plan = getQueryPlan();
    const merchant = findMerchant(plan);
    if(!merchant){
      renderNotFound();
      return;
    }
    merchant.memberName = getQueryParam('member');
    merchant.orderNumber = getQueryParam('order');

    root.innerHTML = `<div class="not-found"><div class="icon">⏳</div><h2>確認中</h2><p>正在確認兌換狀態，請稍候...</p></div>`;

    checkAlreadyUsed(merchant.orderNumber, merchant.memberName, merchant.offerTitle).then(info => {
      if(info.used){
        renderAlreadyUsed(merchant, info);
      } else {
        renderOffer(merchant);
      }
    });
  })();
</script>
